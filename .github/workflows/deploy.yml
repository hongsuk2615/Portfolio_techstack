name: Deploy Portfolio Service

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load environment variables
        run: |
          set -a
          source /home/hongsuk/project/docker/tech_stack/.env
          set +a
          echo "SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Copy JAR to docker directory
        run: |
          mkdir -p /home/hongsuk/project/docker/tech_stack/build/libs
          cp build/libs/*.jar /home/hongsuk/project/docker/tech_stack/build/libs/

      - name: Build Docker image
        run: |
          cd /home/hongsuk/project/docker/tech_stack
          docker compose build

      - name: Deploy with Docker Compose
        run: |
          cd /home/hongsuk/project/docker/tech_stack
          docker compose down
          docker compose up -d

      - name: Check deployment status
        run: |
          cd /home/hongsuk/project/docker/tech_stack
          docker compose ps
