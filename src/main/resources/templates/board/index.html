<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <th:block th:replace="~{layout/commonHeader :: commonHeader}"></th:block>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3451d1;
            --secondary-color: #6c757d;
            --success-color: #06d6a0;
            --danger-color: #ef476f;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .board-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
        }

        .board-header h2 {
            color: white;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #writeBtn {
            background: var(--primary-color);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        #writeBtn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .board-controls {
            display: flex;
            flex-direction: column;
            margin-top: 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            gap: 1.5rem;
        }

        .top-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1.5rem;
        }

        .left-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            grid-column: 2;
        }

        .sort-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .sort-selector select {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.45rem 0.7rem;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .sort-selector select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            white-space: nowrap;
            justify-self: end;
        }

        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .page-size-selector select {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.45rem 0.7rem;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .page-size-selector select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .total-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .total-count span {
            font-weight: 700;
            color: var(--primary-color);
        }

        .board-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .board-table table {
            width: 100%;
            margin-bottom: 0;
        }

        .board-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .board-table th {
            color: white;
            font-weight: 600;
            text-align: center;
            padding: 1.2rem 1rem;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .board-table td {
            padding: 1.2rem 1rem;
            text-align: center;
            vertical-align: middle;
            color: var(--text-primary);
        }

        .board-table .title-cell {
            text-align: left;
            font-weight: 500;
            color: var(--text-primary);
        }

        .board-table .title-cell:hover {
            color: var(--primary-color);
        }

        .board-table tbody tr {
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .board-table tbody tr:last-child {
            border-bottom: none;
        }

        .board-table tbody tr:hover {
            background: linear-gradient(to right, #f8f9fa 0%, #ffffff 100%);
            transform: scale(1.01);
        }

        .pagination-wrapper {
            display: flex;
            align-items: center;
        }

        .pagination {
            display: flex;
            gap: 0.4rem;
            margin: 0;
            flex-wrap: wrap;
        }

        .bottom-controls {
            display: flex;
            justify-content: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .pagination .page-item .page-link {
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.45rem 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .pagination .page-item .page-link:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .pagination .page-item.active .page-link {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            justify-content: center;
        }

        .search-box select,
        .search-box input {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .search-box select {
            min-width: 110px;
        }

        .search-box input {
            min-width: 250px;
            width: 400px;
        }

        .search-box select:focus,
        .search-box input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
            outline: none;
        }

        .search-box button {
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 0.6rem 2rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .search-box button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .empty-board {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-board p {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .badge-new {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 4px rgba(239, 71, 111, 0.3);
        }

        .comment-count {
            color: var(--primary-color);
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .top-controls {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .left-group {
                grid-column: 1;
                justify-content: center;
            }

            .right-controls {
                width: 100%;
                justify-self: center;
                justify-content: space-between;
            }

            .search-box {
                width: 100%;
                flex-wrap: wrap;
            }

            .search-box input {
                flex: 1;
                min-width: 200px;
            }
        }

        @media (max-width: 768px) {
            .board-container {
                padding: 0 1rem;
            }

            .board-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            #writeBtn {
                width: 100%;
            }

            .board-table .col-author,
            .board-table .col-date,
            .board-table .col-views {
                display: none;
            }

            .left-group {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .pagination-wrapper {
                justify-content: center;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box select,
            .search-box input,
            .search-box button {
                width: 100%;
            }

            .right-controls {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>

<div class="content">
    <div class="board-container">
        <!-- 헤더 -->
        <div class="board-header">
            <h2 class="color-white">📝 게시판</h2>
            <button id="writeBtn" class="btn btn-primary">
                글쓰기
            </button>
        </div>

        <!-- 게시글 목록 -->
        <div class="board-table">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 80px;">번호</th>
                        <th>제목</th>
                        <th class="col-author" style="width: 150px;">작성자</th>
                        <th class="col-date" style="width: 150px;">작성일</th>
                        <th class="col-views" style="width: 100px;">조회수</th>
                    </tr>
                </thead>
                <tbody id="boardList">
                    <!-- 게시글 목록이 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
        </div>

        <!-- 하단 컨트롤 -->
        <div class="board-controls">
            <!-- 상단: 페이징 + 정렬 + 페이지 크기 + 전체 개수 -->
            <div class="top-controls">
                <div class="left-group">
                    <!-- 페이징 -->
                    <div class="pagination-wrapper">
                        <nav>
                            <ul id="pagination" class="pagination">
                                <!-- 페이징이 여기에 동적으로 추가됩니다 -->
                            </ul>
                        </nav>
                    </div>

                    <!-- 정렬 -->
                    <div class="sort-selector">
                        <select id="sortType">
                            <option value="latest">최신순</option>
                            <option value="views">조회순</option>
                        </select>
                    </div>
                </div>

                <!-- 우측: 페이지 크기 + 전체 개수 -->
                <div class="right-controls">
                    <div class="page-size-selector">
                        <select id="pageSize">
                            <option value="10">10개</option>
                            <option value="20">20개</option>
                            <option value="50">50개</option>
                            <option value="100">100개</option>
                        </select>
                        <span>씩 보기</span>
                    </div>
                    <div class="total-count">
                        <span>전체 <span id="totalCount">0</span>개</span>
                    </div>
                </div>
            </div>

            <!-- 하단: 검색 -->
            <div class="bottom-controls">
                <div class="search-box">
                    <select id="searchType">
                        <option value="all">전체</option>
                        <option value="title">제목</option>
                        <option value="content">내용</option>
                        <option value="author">작성자</option>
                    </select>
                    <input type="text" id="searchKeyword" placeholder="🔎 검색어를 입력하세요">
                    <button id="searchBtn">검색</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    let totalPages = 1;
    let pageSize = 10;
    let sortType = 'latest';
    let searchType = 'all';
    let searchKeyword = '';

    // 페이지 로드 시 실행
    document.addEventListener('DOMContentLoaded', () => {
        setupEventListeners();
        // URL 파라미터에서 초기 상태 복원
        restoreStateFromUrl();
        loadBoardList(false); // 초기 로드는 히스토리에 추가하지 않음

        // 브라우저 뒤로가기/앞으로가기 처리
        window.addEventListener('popstate', (event) => {
            restoreStateFromUrl();
            loadBoardList(false); // popstate는 이미 히스토리 이동이므로 추가 안 함
        });
    });

    // URL 파라미터에서 상태 복원
    function restoreStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        currentPage = parseInt(params.get('page')) || 1;
        pageSize = parseInt(params.get('size')) || 10;
        sortType = params.get('sort') || 'latest';
        searchType = params.get('searchType') || 'all';
        searchKeyword = params.get('keyword') || '';

        // 폼에 값 복원
        document.getElementById('pageSize').value = pageSize;
        document.getElementById('sortType').value = sortType;
        document.getElementById('searchType').value = searchType;
        document.getElementById('searchKeyword').value = searchKeyword;
    }

    // URL 업데이트 (브라우저 히스토리에 기록)
    function updateUrl(addToHistory = false) {
        const params = new URLSearchParams();

        if (currentPage > 1) {
            params.set('page', currentPage);
        }

        if (pageSize !== 10) {
            params.set('size', pageSize);
        }

        if (sortType !== 'latest') {
            params.set('sort', sortType);
        }

        if (searchType !== 'all') {
            params.set('searchType', searchType);
        }

        if (searchKeyword) {
            params.set('keyword', searchKeyword);
        }

        const newUrl = params.toString()
            ? `${window.location.pathname}?${params.toString()}`
            : window.location.pathname;

        const state = { page: currentPage, pageSize, sortType, searchType, searchKeyword };

        if (addToHistory) {
            // 새 항목을 히스토리에 추가 (뒤로가기 가능)
            window.history.pushState(state, '', newUrl);
        } else {
            // 현재 항목만 업데이트 (뒤로가기 시 이전 상태로)
            window.history.replaceState(state, '', newUrl);
        }
    }

    // 게시글 목록 로드
    async function loadBoardList(addToHistory = false) {
        try {
            // URL 업데이트
            updateUrl(addToHistory);

            // TODO: 실제 API 엔드포인트로 변경
            const params = new URLSearchParams({
                page: currentPage,
                size: pageSize,
                sort: sortType,
                searchType: searchType,
                keyword: searchKeyword
            });

            // const response = await fetch(`/api/board?${params}`);
            // const data = await response.json();

            // 임시 데이터 (백엔드 구현 전)
            const data = generateMockData(currentPage, pageSize, sortType);

            renderBoardList(data.content);
            renderPagination(data.totalPages, data.currentPage);

            // 전체 게시글 수 표시
            document.getElementById('totalCount').textContent = data.totalElements;
        } catch (error) {
            console.error('게시글 목록 로드 실패:', error);
            showEmptyBoard();
        }
    }

    // 게시글 목록 렌더링
    function renderBoardList(posts) {
        const boardList = document.getElementById('boardList');

        if (!posts || posts.length === 0) {
            showEmptyBoard();
            return;
        }

        boardList.innerHTML = posts.map(post => {
            const isNew = isNewPost(post.createdAt);
            const newBadge = isNew ? '<span class="badge-new">NEW</span>' : '';

            return `
                <tr onclick="goToDetail(${post.id})">
                    <td><strong>${post.id}</strong></td>
                    <td class="title-cell">
                        ${post.title}${newBadge}
                        ${post.commentCount > 0 ? `<span class="comment-count ms-2">[${post.commentCount}]</span>` : ''}
                    </td>
                    <td class="col-author">${post.author}</td>
                    <td class="col-date">${formatDate(post.createdAt)}</td>
                    <td class="col-views">${post.views.toLocaleString()}</td>
                </tr>
            `;
        }).join('');
    }

    // 빈 게시판 표시
    function showEmptyBoard() {
        const boardList = document.getElementById('boardList');
        boardList.innerHTML = `
            <tr>
                <td colspan="5" class="empty-board">
                    <p>📭 게시글이 없습니다</p>
                    <small>첫 번째 게시글을 작성해보세요!</small>
                </td>
            </tr>
        `;
        document.getElementById('pagination').innerHTML = '';
        document.getElementById('totalCount').textContent = '0';
    }

    // 페이징 렌더링
    function renderPagination(total, current) {
        totalPages = total;
        currentPage = current;

        const pagination = document.getElementById('pagination');
        if (total <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '';

        // 이전 버튼
        if (current > 1) {
            html += `<li class="page-item"><a class="page-link" onclick="changePage(${current - 1})">이전</a></li>`;
        }

        // 페이지 번호
        const startPage = Math.max(1, current - 2);
        const endPage = Math.min(total, current + 2);

        for (let i = startPage; i <= endPage; i++) {
            const active = i === current ? 'active' : '';
            html += `<li class="page-item ${active}"><a class="page-link" onclick="changePage(${i})">${i}</a></li>`;
        }

        // 다음 버튼
        if (current < total) {
            html += `<li class="page-item"><a class="page-link" onclick="changePage(${current + 1})">다음</a></li>`;
        }

        pagination.innerHTML = html;
    }

    // 페이지 변경
    function changePage(page) {
        currentPage = page;
        loadBoardList(true); // 히스토리에 추가
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 이벤트 리스너 설정
    function setupEventListeners() {
        // 페이지 크기 변경
        document.getElementById('pageSize').addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value);
            currentPage = 1; // 페이지 크기 변경 시 첫 페이지로
            loadBoardList(true); // 히스토리에 추가
        });

        // 정렬 변경
        document.getElementById('sortType').addEventListener('change', (e) => {
            sortType = e.target.value;
            currentPage = 1; // 정렬 변경 시 첫 페이지로
            loadBoardList(true); // 히스토리에 추가
        });

        // 검색
        document.getElementById('searchBtn').addEventListener('click', () => {
            searchType = document.getElementById('searchType').value;
            searchKeyword = document.getElementById('searchKeyword').value;
            currentPage = 1;
            loadBoardList(true); // 히스토리에 추가
        });

        // Enter 키로 검색
        document.getElementById('searchKeyword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        // 글쓰기
        document.getElementById('writeBtn').addEventListener('click', () => {//글쓰기 페이지로 이동
                window.location.href = '/board/write';
        });
    }

    // 상세 페이지로 이동
    function goToDetail(postId) {
        window.location.href = `/board/${postId}`;
    }

    // 날짜 포맷
    function formatDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMins < 1) return '방금 전';
        if (diffMins < 60) return `${diffMins}분 전`;
        if (diffHours < 24) return `${diffHours}시간 전`;

        // 1일 이후부터는 yyyy.mm.dd 형식
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}.${month}.${day}`;
    }

    // 새 게시글 여부 (6시간 이내)
    function isNewPost(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffHours = (now - date) / 3600000;
        return diffHours < 6;
    }

    // 임시 Mock 데이터 생성 (백엔드 구현 전)
    function generateMockData(page, size, sort = 'latest') {
        // 전체 데이터 생성
        const allPosts = [];
        const totalPosts = 2000; // 총 게시글 수

        for (let i = 0; i < totalPosts; i++) {
            const postId = totalPosts - i;
            const now = new Date();
            const createdAt = new Date(now - Math.random() * 30 * 24 * 60 * 60 * 1000); // 최근 30일 내

            allPosts.push({
                id: postId,
                title: `게시글 제목 ${postId} - 샘플 데이터입니다`,
                author: `사용자${postId % 10 + 1}`,
                createdAt: createdAt.toISOString(),
                views: Math.floor(Math.random() * 1000),
                commentCount: Math.floor(Math.random() * 20)
            });
        }

        // 정렬
        if (sort === 'views') {
            // 조회순 (내림차순)
            allPosts.sort((a, b) => b.views - a.views);
        } else {
            // 최신순 (기본값)
            allPosts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        // 페이징
        const start = (page - 1) * size;
        const end = Math.min(start + size, totalPosts);
        const posts = allPosts.slice(start, end);

        return {
            content: posts,
            currentPage: page,
            totalPages: Math.ceil(totalPosts / size),
            totalElements: totalPosts
        };
    }
</script>
</body>
</html>
