<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <th:block th:replace="~{layout/commonheader :: commonheader}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content" style="text-align: center; margin-top: 5%;">
    <h1>✍️ 회원가입</h1>

    <div id="errorMessage" class="alert alert-danger" style="max-width: 500px; margin: 1rem auto; display: none;"></div>
    <div id="successMessage" class="alert alert-success" style="max-width: 500px; margin: 1rem auto; display: none;"></div>

    <div style="max-width: 400px; margin: 2rem auto;">
        <form id="registerForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="name" placeholder="이름" required>
            </div>
            <div class="mb-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="providerId" placeholder="아이디 (4-20자)" required minlength="4" maxlength="20">
                    <button type="button" class="btn btn-outline-secondary" id="checkProviderIdBtn">중복 확인</button>
                </div>
                <small id="providerIdCheck" class="form-text"></small>
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="이메일 (선택)">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="비밀번호 (최소 8자)" required minlength="8">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="passwordConfirm" placeholder="비밀번호 확인" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">회원가입</button>
        </form>
        <div class="mt-3">
            <a href="/auth/login">이미 계정이 있으신가요? 로그인</a>
        </div>
    </div>

    <div style="max-width: 400px; margin: 2rem auto;">
        <hr>
        <p class="text-muted">또는 소셜 계정으로 시작하기</p>
    </div>

    <div>
        <a class="btn btn-outline-light mt-2" href="/oauth2/authorization/google">Google로 시작하기</a>
        <br><br>
        <a class="btn btn-outline-light" href="/oauth2/authorization/github">GitHub로 시작하기</a>
    </div>
</div>
<script>
    const providerIdInput = document.getElementById('providerId');
    const providerIdCheck = document.getElementById('providerIdCheck');
    const checkProviderIdBtn = document.getElementById('checkProviderIdBtn');
    let providerIdChecked = false;

    // 아이디 입력 시 중복 확인 상태 초기화
    providerIdInput.addEventListener('input', () => {
        providerIdChecked = false;
        providerIdCheck.textContent = '';
    });

    // 아이디 중복 확인 버튼
    checkProviderIdBtn.addEventListener('click', async () => {
        const providerId = providerIdInput.value.trim();
        providerIdCheck.textContent = '';

        // 아이디 형식 검증 (4-20자, 영문/숫자)
        const providerIdPattern = /^[a-zA-Z0-9]{4,20}$/;
        if (!providerId || !providerIdPattern.test(providerId)) {
            providerIdCheck.textContent = '아이디는 4-20자의 영문/숫자만 가능합니다';
            providerIdCheck.style.color = 'red';
            providerIdChecked = false;
            return;
        }

        try {
            const response = await fetch(`/api/auth/check-providerId?providerId=${encodeURIComponent(providerId)}`);
            const data = await response.json();

            if (data.message.includes('사용 가능')) {
                providerIdCheck.textContent = '✓ ' + data.message;
                providerIdCheck.style.color = 'green';
                providerIdChecked = true;
            } else {
                providerIdCheck.textContent = '✗ ' + data.message;
                providerIdCheck.style.color = 'red';
                providerIdChecked = false;
            }
        } catch (error) {
            providerIdCheck.textContent = '서버 오류가 발생했습니다';
            providerIdCheck.style.color = 'red';
            providerIdChecked = false;
        }
    });

    // 회원가입 폼 제출
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const providerId = providerIdInput.value.trim();
        const email = document.getElementById('email').value.trim() || null;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        // 아이디 중복 확인 체크
        if (!providerIdChecked) {
            errorDiv.textContent = '아이디 중복 확인을 해주세요';
            errorDiv.style.display = 'block';
            return;
        }

        // 비밀번호 확인
        if (password !== passwordConfirm) {
            errorDiv.textContent = '비밀번호가 일치하지 않습니다';
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, providerId, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                successDiv.textContent = data.message || '회원가입이 완료되었습니다';
                successDiv.style.display = 'block';
                setTimeout(() => window.location.href = '/auth/login', 2000);
            } else {
                errorDiv.textContent = data.message || '회원가입에 실패했습니다';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = '서버 오류가 발생했습니다';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
