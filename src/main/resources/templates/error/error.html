<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오류 발생</title>
    <th:block th:replace="~{layout/commonHeader :: commonHeader}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content" style="text-align: center; margin-top: 10%;">
    <h1>⚠️ 오류가 발생했습니다</h1>
    <p class="text-muted">요청을 처리하는 중 문제가 발생했습니다.</p>

    <div style="max-width: 600px; margin: 2rem auto;">
        <div class="alert alert-warning">
            <p><strong>오류 코드:</strong> <span th:text="${status}">500</span></p>
            <p th:if="${message}"><strong>메시지:</strong> <span th:text="${message}">Internal Server Error</span></p>
        </div>
    </div>

    <div class="mt-4">
        <a href="/static" class="btn btn-primary me-2">메인으로 돌아가기</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">이전 페이지</a>
    </div>
</div>
</body>
</html>
